name: End-to-end (Functions host + Azurite)

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

jobs:
    e2e:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10.10.0
                  run_install: false

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # The harness builds dist/ and refreshes the example's file:
            # dependency snapshot itself, so the example installs there.
            - name: Install example dependencies
              run: pnpm install
              working-directory: examples/basic-app

            # 4.12.1: newer releases resolve tarballs from a feed that
            # rejects anonymous installs.
            - name: Install Azure Functions Core Tools
              run: |
                  mkdir -p /tmp/func-tools && cd /tmp/func-tools
                  npm init -y > /dev/null
                  npm install azure-functions-core-tools@4.12.1 --no-audit --no-fund
                  echo "/tmp/func-tools/node_modules/.bin" >> "$GITHUB_PATH"

            - name: Run e2e harness
              run: ./scripts/e2e.sh
